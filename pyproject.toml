[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akashic-records"
version = "0.1.0"
description = "A ritual memory system for AI agents — the soul's eternal archive"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "chromadb>=0.5.0",
    "sqlmodel>=0.0.21",
    "aiosqlite>=0.20.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
